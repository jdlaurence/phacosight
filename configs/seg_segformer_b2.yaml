# Primary segmentation candidate: SegFormer-B2 on anatomy + lumped instruments.
run_name: segformer_b2_anatomy_instrument
model: segformer_b2
task: anatomy_instrument

# Local directory containing the case_* folders
# (…/semantic_segmentation_images_annotations/Images_and_Supervisely_Annotations)
data_root: data/Images_and_Supervisely_Annotations
fold_csv_dir: TrainIDs_SemanticSegmentation_FiveFold/TrainIDs_Cataract_1k_Anatomy_Instruments
fold_csv_prefix: Cat1k_anatomy_instrument
num_folds: 5

image_size: 512
batch_size: 8
epochs: 40
lr: 6.0e-5
weight_decay: 0.01
dice_weight: 0.8
oversample_rare_instruments: true
num_workers: 4
out_dir: runs
