# Stage 1 follow-up: multiclass instruments (6 tool groups + background)
# with the bake-off winner. Same recipe as the bake-off; the fold CSVs'
# mask paths are remapped to mask_instruments_MultiClass by the task's
# mask_dir (see phacosight.data.folds).
run_name: segformer_b2_instrument_multiclass
model: segformer_b2
task: instrument_multiclass

data_root: data/cataract1k/segmentation/Annotations/Images-and-Supervisely-Annotations
fold_csv_dir: upstream/TrainIDs_SemanticSegmentation_FiveFold/TrainIDs_Cataract_1k_Instruments
fold_csv_prefix: Cat1k_instrument
num_folds: 5

image_size: 512
batch_size: 8
epochs: 40
lr: 6.0e-5
weight_decay: 0.01
dice_weight: 0.8
oversample_rare_instruments: true
num_workers: 4
out_dir: runs
