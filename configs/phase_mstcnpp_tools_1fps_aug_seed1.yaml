# E7-b: winning Stage-2 recipe + CATARACTS train+dev in training folds only
# (docs/cataracts-harmonization-plan.md, pre-registered; frozen label map)
run_name: phase_mstcnpp_tools_1fps_aug_seed1
head: mstcnpp
features: data/features/phase_dinov2l
split_dir: splits/phase
num_folds: 4

epochs: 60
lr: 5.0e-4
weight_decay: 1.0e-4
tmse_weight: 0.15
class_weighted: true
select_on: macro_f1
seed: 1
out_dir: runs
extra_features:
  - data/features/phase_tools
frame_stride: 5
features_fps: 5.0

aug_features: data/features/cataracts_dinov2l
aug_extra_features:
  - data/features/cataracts_tools
aug_root: data/cataracts
aug_splits: [train, dev]
